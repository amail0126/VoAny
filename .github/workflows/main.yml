name: Build Android APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Compatible NDK (r25c)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
      - name: Prepare OpenSSL for strongSwan
        run: |
          if [ ! -f "VoAnyLib/src/main/jni/openssl/Android.mk" ]; then
            git clone --depth 1 https://github.com/strongswan/openssl.git VoAnyLib/src/main/jni/openssl
          fi
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug -Pandroid.ndkVersion=25.2.9519653 > build.log 2>&1 || {
            echo "=== NDK 完整錯誤輸出 ==="
            grep -iE "Android NDK:|error:|fatal|No such file|Stop\." build.log | tail -n 40
            exit 1
          }
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoAny-Debug-APK
          path: "**/build/outputs/apk/**/*.apk"
