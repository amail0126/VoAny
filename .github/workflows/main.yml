name: Build Android APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Android SDK 36 & NDK 27.1.12297006
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "ndk;27.1.12297006"
      - name: Install Build Dependencies & Prepare Upstreams
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config gperf gettext bison flex libgmp-dev perl
          python3 VoAnyLib/prepare-upstreams.py
          cd VoAnyLib/.upstream/strongswan
          autoreconf -i
          ./configure --disable-defaults
          if [ ! -f "Android.common.mk" ] && [ -f "Android.common.mk.in" ]; then
            sed 's/@PACKAGE_VERSION@/5.9.14/g; s/@PACKAGE_VERSION_MAJOR@/5/g; s/@PACKAGE_VERSION_MINOR@/9/g; s/@PACKAGE_VERSION_MICRO@/14/g; s/@PACKAGE_VERSION_REVIEW@//g' Android.common.mk.in > Android.common.mk
          fi
          (cd src/libstrongswan/asn1 && perl oid.pl oid.txt > oid.c && perl oid.pl -h oid.txt > oid.h)
          (cd src/libstrongswan/crypto/proposal && gperf -N proposal_get_token -m 10 -C -G -c -t -D < proposal_keywords_static.txt > proposal_keywords_static.c && gperf -N proposal_get_token -m 10 -C -G -c -t -D --output-file=proposal_keywords_static.h proposal_keywords_static.txt)
          make -C src/libstrongswan settings/settings_parser.c settings/settings_lexer.c crypto/proposal/proposal_keywords_static.h || true
          find . -name "*.y" -exec sh -c 'dir=$(dirname "$1"); base=$(basename "$1" .y); [ ! -f "$dir/$base.c" ] && (cd "$dir" && bison -d -o "$base.c" "$base.y") || true' _ {} \;
          find . -name "*.l" -exec sh -c 'dir=$(dirname "$1"); base=$(basename "$1" .l); [ ! -f "$dir/$base.c" ] && (cd "$dir" && flex --outfile="$base.c" --header-file="$base.h" "$base.l") || true' _ {} \;
          cd ../../..
          wget -q https://github.com/openssl/openssl/releases/download/openssl-3.5.4/openssl-3.5.4.tar.gz
          tar -xzf openssl-3.5.4.tar.gz
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006
          export OPENSSL_SRC=$PWD/openssl-3.5.4
          bash VoAnyLib/native/build-openssl.sh
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :VoAnyApp:assembleDebug -PvoanyPython=python3 > build.log 2>&1 || {
            echo "=== NDK 真正錯誤行 ==="
            grep -iE "Android NDK:|error:|fatal|undefined|No such file|Stop\." build.log | tail -n 35
            exit 1
          }
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoAny-Debug-APK
          path: VoAnyApp/build/outputs/apk/debug/VoAnyApp-debug.apk
