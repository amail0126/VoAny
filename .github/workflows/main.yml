name: Build Android APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Inspect Project Build Instructions
        run: |
          echo "=== 1. README.md 內容 ==="
          cat README.md || echo "無 README.md"
          echo "=== 2. 專案內的腳本檔案 ==="
          find . -maxdepth 4 -name "*.sh" -o -name "*openssl*"
          echo "=== 3. Android.mk 第 70~100 行 ==="
          sed -n '70,100p' VoAnyLib/src/main/jni/Android.mk
